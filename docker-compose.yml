version: "3.9"
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      PRIMARY_DB_URL: postgresql+psycopg2://platform:platform@db:5432/platform
      ASYNC_DB_URL: postgresql+asyncpg://platform:platform@db:5432/platform
      REDIS_URL: redis://redis:6379/0
    depends_on: [db, redis]

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

volumes:
  pgdata:
